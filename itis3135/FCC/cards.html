<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../styles/default.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITIS3135 | Matthew Bridges's | Determined 49er | Cards</title>
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <style>
    /* #5 */
    #playing-cards {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 40px;
    }

    /* #6 */
    .card {
      box-sizing: border-box;
      display: flex;
      justify-content: space-between;
      width: 120px;
      height: 180px;
      border: 2px solid black;
      border-radius: 8px;
      padding: 10px;
      font-size: 20px;
      font-weight: bold;
    }
    /* #7 */
    .left {
      align-self: flex-start;
    }

    /* #8 & #10 */
    .middle {
      align-self: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 30px;
    }

    /* #9 */
    .right {
      align-self: flex-end;
    }
  </style>
</head>

<body>
    <div data-include="../components/header.html"></div>
  <!-- #2 -->
  <main>
    <h2>Cards</h2>

    <div id="playing-cards">
        <!-- Card 1 -->
        <div class="card">
            <div class="left">♠ A</div>
            <div class="middle">♠</div>
            <div class="right">A ♠</div>
        </div>

        <!-- Card 2 -->
        <div class="card">
            <div class="left">♥ K</div>
            <div class="middle">♥</div>
            <div class="right">K ♥</div>
        </div>

        <!-- Card 3 -->
        <div class="card">
            <div class="left">♦ Q</div>
            <div class="middle">♦</div>
            <div class="right">Q ♦</div>
        </div>
    </div>
</main>
    <div data-include="../components/footer.html"></div>
    <script src="../scripts/include.min.js"></script>
</body>
</html>
