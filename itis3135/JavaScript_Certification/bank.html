<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petal Path | Petal Bank</title>
    <link rel="stylesheet" href="../styles/flower.css">
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>

<body>
    <div data-include="components/header.html"></div>

    <main>
        <h2>Petal Bank Account Manager</h2>

        <section class="bank-intro">
            <h3>About This Flower Tool</h3>
            <p>
                Use this account manager to track flower shop deposits, supply purchases,
                and the current Petal Path garden budget.
            </p>
        </section>

        <section class="flower-card bank-card">
            <h3>Flower Shop Transactions</h3>

            <div class="button-row">
                <button type="button" onclick="depositRoseSale()">Deposit Rose Sale</button>
                <button type="button" onclick="depositTulipSale()">Deposit Tulip Sale</button>
                <button type="button" onclick="buySupplies()">Buy Supplies</button>
                <button type="button" onclick="buySeeds()">Buy Seeds</button>
                <button type="button" onclick="showBalance()">Check Balance</button>
                <button type="button" onclick="showDeposits()">List Deposits</button>
                <button type="button" onclick="showWithdrawals()">List Withdrawals</button>
            </div>

            <p id="account-message">Choose a transaction to begin.</p>
        </section>

        <section class="flower-card account-card">
            <h3>Account Activity</h3>
            <pre id="account-output"></pre>
        </section>
    </main>

    <div data-include="components/footer.html"></div>

    <script src="../scripts/include.min.js"></script>
    <script src="../scripts/bank.js"></script>
</body>
</html>
