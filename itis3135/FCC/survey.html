<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles/default.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matthew Bridges | ITIS 3135 | Playing Cards</title>
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
</head>


    <h1 id="title">Matt's Survey Experience</h1>

    <p id="description">
      Thank you for helping us improve our platform. Please fill out the form below.
    </p>

    <form id="survey-form">

      <!-- Name -->
      <label id="name-label" for="name">Name</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter your full name"
        required/>

      <!-- Email -->
      <label id="email-label" for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email address"
        required/>

      <!-- Number -->
      <label id="number-label" for="number">Age</label>
      <input
        type="number"
        id="number"
        name="age"
        placeholder="Enter your age"
        min="10"
        max="100"/>

      <!-- Dropdown -->
      <label for="dropdown">What best describes your role?</label>
      <select id="dropdown" name="role">
        <option value="">Select your role</option>
        <option value="student">Student</option>
        <option value="developer">Developer</option>
        <option value="other">Other</option>
      </select>

      <!-- Radio Buttons -->
      <p>Would you recommend us?</p>
      <label>
        <input type="radio" name="recommend" value="yes" /> Yes
      </label>
      <label>
        <input type="radio" name="recommend" value="no" /> No
      </label>

      <!-- Checkboxes -->
      <p>What would you like to see improved?</p>
      <label>
        <input type="checkbox" value="frontend" /> Frontend Projects
      </label>
      <label>
        <input type="checkbox" value="backend" /> Backend Projects
      </label>
      <label>
        <input type="checkbox" value="data" /> Data Visualization
</label>

      <!-- Textarea -->
      <label for="comments">Additional Comments</label>
      <textarea
        id="comments"
        name="comments"
        placeholder="Enter your comments here..."></textarea>

      <!-- Submit -->
      <button id="submit" type="submit">Submit</button>

    </form>

  </body>
</html>
