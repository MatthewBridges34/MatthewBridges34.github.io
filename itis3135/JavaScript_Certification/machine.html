<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petal Path | Garden Soundboard</title>
    <link rel="stylesheet" href="../styles/flower.css">
</head>

<body>
    <div data-include="components/header.html"></div>

    <main>
        <h2>Garden Soundboard Drum Machine</h2>

        <section class="machine-intro">
            <h3>About This Flower Tool</h3>
            <p>
                Use this flower-themed drum machine to play garden-inspired sounds.
                Click a flower pad or press the matching keyboard letter.
            </p>
        </section>

        <section class="flower-card machine-card">
            <h3>Flower Sound Pads</h3>

            <div id="drum-machine">
                <p id="display">Press a flower pad...</p>

                <div id="pad-bank" class="button-row">
                    <button class="drum-pad" id="Rose-Rhythm">Q
                        <audio class="clip" id="Q" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-1.mp3"></audio>
                    </button>

                    <button class="drum-pad" id="Tulip-Tap">W
                        <audio class="clip" id="W" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-2.mp3"></audio>
                    </button>

                    <button class="drum-pad" id="Daisy-Drop">E
                        <audio class="clip" id="E" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-3.mp3"></audio>
                    </button>

                    <button class="drum-pad" id="Lily-Beat">A
                        <audio class="clip" id="A" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-4_1.mp3"></audio>
                    </button>

                    <button class="drum-pad" id="Sunflower-Clap">S
                        <audio class="clip" id="S" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-6.mp3"></audio>
                    </button>

                    <button class="drum-pad" id="Orchid-Echo">D
                        <audio class="clip" id="D" src="https://cdn.freecodecamp.org/curriculum/drum/Dsc_Oh.mp3"></audio>
                    </button>

                    <button class="drum-pad" id="Garden-Kick">Z
                        <audio class="clip" id="Z" src="https://cdn.freecodecamp.org/curriculum/drum/Kick_n_Hat.mp3"></audio>
                    </button>

                    <button class="drum-pad" id="Petal-Bass">X
                        <audio class="clip" id="X" src="https://cdn.freecodecamp.org/curriculum/drum/RP4_KICK_1.mp3"></audio>
                    </button>

                    <button class="drum-pad" id="Bloom-Hat">C
                        <audio class="clip" id="C" src="https://cdn.freecodecamp.org/curriculum/drum/Cev_H2.mp3"></audio>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <div data-include="components/footer.html"></div>

    <script src="../scripts/HTMLInclude.min.js"></script>
    <script src="../scripts/machine.js"></script>
</body>
</html>
