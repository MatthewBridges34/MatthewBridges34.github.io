<!DOCTYPE html>
<html lang="en">
<head>
     <link rel="stylesheet" href="styles/default.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matthew Bridges | ITIS 3135 | Book Inventory</title>
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    
</head>
    
<body>

  <!-- Requirement 1: h1 with text "Book Inventory" -->
  <h1>Book Inventory</h1>

  <!-- Requirement 2: Table with specific columns -->
  <table>
    <thead>
      <tr>
        <th>Title</th>
        <th>Author</th>
        <th>Category</th>
        <th>Status</th>
        <th>Rate</th>
      </tr>
    </thead>

    <tbody>

      <!-- Requirement 3 & 4: Row with class read -->
      <tr class="read">
        <td>The Alchemist</td>
        <td>Paulo Coelho</td>
        <td>Fiction</td>

        <!-- Requirement 5: Status column with span.status -->
        <td>
          <span class="status">Read</span>
        </td>

        <!-- Requirement 6: Rate column with span.rate wrapping 3 empty spans -->
        <td>
          <span class="rate one">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </td>
      </tr>

      <!-- Requirement 3 & 4: Row with class to-read -->
      <tr class="to-read">
        <td>Atomic Habits</td>
        <td>James Clear</td>
        <td>Self-Help</td>
        <td>
          <span class="status">To Read</span>
        </td>
        <td>
          <span class="rate two">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </td>
      </tr>

      <!-- Requirement 3 & 4: Row with class in-progress -->
      <tr class="in-progress">
        <td>Clean Code</td>
        <td>Robert C. Martin</td>
        <td>Programming</td>
        <td>
          <span class="status">In Progress</span>
        </td>
        <td>
          <span class="rate three">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </td>
      </tr>

    </tbody>
  </table>

</body>

<script src="scripts/include.min.js"></script>

</html>
